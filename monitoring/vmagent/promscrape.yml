global:
  scrape_interval: 15s
  scrape_timeout: 10s
  external_labels:
    stack: eosin-monitoring

scrape_configs:
  - job_name: eosin-parser
    honor_labels: true
    metrics_path: /metrics
    file_sd_configs:
      - files:
          - /tmp/vmagent-targets/eosin-targets.json

  - job_name: eosin-blackbox-health
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      - files:
          - /tmp/vmagent-targets/blackbox-health-targets.json
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: eosin-blackbox-metrics
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      - files:
          - /tmp/vmagent-targets/blackbox-metrics-targets.json
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: victoriametrics
    static_configs:
      - targets: ["victoriametrics:8428"]

  - job_name: vmagent
    static_configs:
      - targets: ["vmagent:8429"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: vmalert
    static_configs:
      - targets: ["vmalert:8880"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
